services:
  - type: web
    name: mscilabs-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install && npm run prisma:generate -w @cskh/api && npm run build -w @cskh/api
    startCommand: npm run start:render -w @cskh/api
    healthCheckPath: /health
    domains:
      - api.trungtamgiasuskv.cloud
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mscilabs-postgres
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: mscilabs-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_ORIGIN
        value: https://trungtamgiasuskv.cloud,https://www.trungtamgiasuskv.cloud,https://mscilabs-web.onrender.com
      - key: SUPABASE_STORAGE_ENABLED
        value: false
      - key: SUPABASE_CALL_IMAGES_BUCKET
        value: mscilabs-call-images

  - type: web
    name: mscilabs-web
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install && npm run build -w @cskh/web
    startCommand: npm exec -w @cskh/web -- next start -p $PORT
    domains:
      - trungtamgiasuskv.cloud
      - www.trungtamgiasuskv.cloud
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://api.trungtamgiasuskv.cloud

databases:
  - name: mscilabs-postgres
    plan: free
